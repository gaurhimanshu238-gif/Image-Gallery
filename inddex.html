
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Image Gallery</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f2f4f8;
    color: #222;
}

header {
    text-align: center;
    padding: 40px 15px;
}

header h1 {
    font-size: 36px;
    margin-bottom: 10px;
    color: #292b50;
}

header p {
    color: #666;
}

.filters {
    text-align: center;
    margin-bottom: 30px;
}

.filters button {
    padding: 10px 20px;
    margin: 5px;
    border: none;
    border-radius: 25px;
    background: white;
    cursor: pointer;
    transition: 0.3s;
}

.filters button:hover,
.filters button.active {
    background: #5b5ce2;
    color: white;
}

.gallery {
    width: 90%;
    max-width: 1100px;
    margin: auto;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    padding-bottom: 40px;
}

.gallery-item {
    height: 250px;
    overflow: hidden;
    border-radius: 15px;
    cursor: pointer;
    position: relative;
    box-shadow: 0 5px 15px #0002;
}

.gallery-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: 0.4s;
}

.gallery-item:hover img {
    transform: scale(1.1);
    filter: brightness(70%);
}

.gallery-item h3 {
    position: absolute;
    bottom: 15px;
    left: 15px;
    color: white;
    opacity: 0;
    transition: 0.3s;
}

.gallery-item:hover h3 {
    opacity: 1;
}

/* Lightbox */

.lightbox {
    display: none;
    position: fixed;
    z-index: 10;
    inset: 0;
    background: rgba(0,0,0,0.95);
    justify-content: center;
    align-items: center;
}

.lightbox.show {
    display: flex;
}

.lightbox img {
    max-width: 80%;
    max-height: 80vh;
    border-radius: 10px;
}

.close, .nav {
    position: absolute;
    background: #555;
    color: white;
    border: none;
    cursor: pointer;
    padding: 12px 18px;
    font-size: 25px;
    border-radius: 50%;
}

.close {
    top: 20px;
    right: 25px;
}

.prev {
    left: 20px;
}

.next {
    right: 20px;
}

.close:hover, .nav:hover {
    background: #5b5ce2;
}

.counter {
    position: absolute;
    bottom: 20px;
    color: white;
}

footer {
    text-align: center;
    padding: 20px;
    color: #777;
}

/* Responsive Design */

@media(max-width: 800px) {
    .gallery {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media(max-width: 500px) {
    .gallery {
        grid-template-columns: 1fr;
    }

    header h1 {
        font-size: 28px;
    }

    .lightbox img {
        max-width: 90%;
    }
}
</style>
</head>

<body>

<header>
    <h1>Pixel Gallery</h1>
    <p>Explore Beautiful Images Around The World</p>
</header>

<div class="filters">
    <button class="active" data-filter="all">All</button>
    <button data-filter="nature">Nature</button>
    <button data-filter="animals">Animals</button>
    <button data-filter="technology">Technology</button>
    <button data-filter="city">City</button>
</div>

<div class="gallery" id="gallery">

    <div class="gallery-item" data-category="nature">
        <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=800" alt="Nature">
        <h3>Beautiful Nature</h3>
    </div>

    <div class="gallery-item" data-category="animals">
        <img src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=800" alt="Cat">
        <h3>Lovely Cat</h3>
    </div>

    <div class="gallery-item" data-category="city">
        <img src="https://images.unsplash.com/photo-1511818966892-d7d671e672a2?w=800" alt="City">
        <h3>City Architecture</h3>
    </div>

    <div class="gallery-item" data-category="technology">
        <img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=800" alt="Technology">
        <h3>Coding Workspace</h3>
    </div>

    <div class="gallery-item" data-category="nature">
        <img src="https://images.unsplash.com/photo-1500375592092-40eb2168fd21?w=800" alt="Ocean">
        <h3>Ocean View</h3>
    </div>

    <div class="gallery-item" data-category="animals">
        <img src="https://images.unsplash.com/photo-1474511320723-9a56873867b5?w=800" alt="Fox">
        <h3>Wild Fox</h3>
    </div>

</div>

<!-- Lightbox -->

<div class="lightbox" id="lightbox">
    <button class="close" id="close">&times;</button>
    <button class="nav prev" id="prev">&#10094;</button>
    <img id="lightbox-img" src="" alt="Preview">
    <button class="nav next" id="next">&#10095;</button>
    <div class="counter" id="counter"></div>
</div>

<footer>
    <p>Created using HTML, CSS & JavaScript</p>
</footer>

<script>

const cards = [...document.querySelectorAll(".gallery-item")];

const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightbox-img");
const counter = document.getElementById("counter");

let visibleCards = cards;
let currentIndex = 0;

// Image Filters

document.querySelectorAll(".filters button").forEach(button => {

    button.addEventListener("click", () => {

        document.querySelectorAll(".filters button")
        .forEach(btn => btn.classList.remove("active"));

        button.classList.add("active");

        const filter = button.dataset.filter;

        cards.forEach(card => {

            card.style.display =
            filter === "all" ||
            card.dataset.category === filter
            ? "block" : "none";

        });

        visibleCards = cards.filter(
            card => card.style.display !== "none"
        );

    });

});

// Open Lightbox

cards.forEach(card => {

    card.addEventListener("click", () => {

        visibleCards = cards.filter(
            item => item.style.display !== "none"
        );

        currentIndex = visibleCards.indexOf(card);

        showImage(currentIndex);

        lightbox.classList.add("show");

    });

});

// Show Image

function showImage(index) {

    currentIndex =
    (index + visibleCards.length) % visibleCards.length;

    const img = visibleCards[currentIndex].querySelector("img");

    lightboxImg.src = img.src;
    lightboxImg.alt = img.alt;

    counter.textContent =
    `${currentIndex + 1} / ${visibleCards.length}`;

}

// Next Image

document.getElementById("next").onclick = () => {
    showImage(currentIndex + 1);
};

// Previous Image

document.getElementById("prev").onclick = () => {
    showImage(currentIndex - 1);
};

// Close Lightbox

document.getElementById("close").onclick = () => {
    lightbox.classList.remove("show");
};

// Close by clicking outside image

lightbox.onclick = (event) => {
    if (event.target === lightbox) {
        lightbox.classList.remove("show");
    }
};

// Keyboard Support

document.addEventListener("keydown", (event) => {

    if (!lightbox.classList.contains("show")) return;

    if (event.key === "ArrowRight") {
        showImage(currentIndex + 1);
    }

    if (event.key === "ArrowLeft") {
        showImage(currentIndex - 1);
    }

    if (event.key === "Escape") {
        lightbox.classList.remove("show");
    }

});

</script>

</body>
</html>
